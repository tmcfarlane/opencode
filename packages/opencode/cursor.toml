# Cursor Provider Definition for models.dev
# This file defines the Cursor provider for contribution to https://github.com/sst/models.dev
#
# Cursor is a built-in OpenCode provider that uses the cursor-agent CLI
# to access Cursor's AI models through a local proxy server.
#
# Usage: Submit this file to models.dev to make Cursor available in the public provider database
# After acceptance, OpenCode can remove the hardcoded provider injection in provider.ts

id = "cursor"
name = "Cursor Agent"
api = "http://localhost:32123/v1"
env = []

# Model: auto (Automatic model selection)
[[models]]
id = "auto"
name = "Cursor Auto"
attachment = true
reasoning = false
temperature = true
tool_call = true
modalities.input = ["text", "image"]
modalities.output = ["text"]
limit.context = 200000
limit.output = 16384
cost.input = 0.0
cost.output = 0.0
release_date = "2025-01-01"

